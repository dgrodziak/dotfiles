- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- shell:
    # Create local files if they're not already created
    - type nul >> codex/local.config.toml
    - type nul >> gitconfig_local
    - type nul >> shell_local
    - type nul >> starship.local.toml
    - type nul >> ssh/config_local

- link:
    ~/.bash:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/statusline.sh: claude/statusline.sh
    ~/.codex/config.toml: codex/config.toml
    ~/.codex/local.config.toml: codex/local.config.toml
    ~/.config/lazygit/config.yml: lazygit/config.yml
    ~/.config/nvim: nvim
    ~/.config/ruff/ruff.toml: ruff.toml
    ~/.config/starship.toml: starship.toml
    ~/.config/starship.local.toml: starship.local.toml
    ~/.gitconfig:
    ~/.gitconfig_local:
    ~/.gitignore_global:
    ~/.ipython/profile_default/ipython_config.py: ipython/ipython_config.py
    ~/.ipython/profile_default/ipython_kernel_config.py: ipython/ipython_kernel_config.py
    ~/.ipython/profile_default/startup/disable_warnings.py: ipython/disable_warnings.py
    ~/.shell:
    ~/.ssh/config: ssh/config
    ~/.ssh/config_local: ssh/config_local
    # Windows-specific links
    ~/AppData/Local/nvim: nvim
    ~/AppData/Roaming/ruff/ruff.toml: ruff.toml
    ~/Documents/PowerShell/profile.ps1: powershell/profile.ps1
    ~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1: powershell/profile.ps1
    ~/vimfiles: vim
    ~/_vimrc: vimrc

- create:
    - ~/.vim/undodir

- shell:
    - >
      git clean -fdx
      vim/pack/vendor/start
      zsh/plugins
